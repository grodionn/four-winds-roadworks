plugins { id 'fabric-loom' version '1.10.5' }

repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.17.3'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.12+1.20.1'
}

apply from: '../modern.gradle'
sourceSets.main.java.srcDir('../fabric-common/src/main/java')
sourceSets.main.resources.srcDir('../fabric-common/src/main/resources')

processResources {
    exclude 'META-INF/neoforge.mods.toml', 'data/fourwindsroadworks/neoforge/**'
    filesMatching('fabric.mod.json') { expand(modVersion: project.version, gameVersion: '1.20.1', javaVersion: '17', apiVersion: '0.92.12') }
}
