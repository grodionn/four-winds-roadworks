plugins { id 'fabric-loom' version '1.10.5' }

repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:1.19.2'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.17.3'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.77.0+1.19.2'
}

apply from: '../modern.gradle'
sourceSets.main.java.srcDir('../chunk-nbt/src/main/java')
sourceSets.main.resources.srcDir('../fabric-common/src/main/resources')

processResources {
    exclude 'META-INF/neoforge.mods.toml', 'data/fourwindsroadworks/neoforge/**'
    filesMatching('fabric.mod.json') { filter { it.replace('"fourwindsroadworks.mixins.json"', '"fourwindsroadworks.mixins.json","fourwindsroadworks.nbt.mixins.json","fourwindsroadworks.fabric.nbt.mixins.json"') } }
    filesMatching('fabric.mod.json') { expand(modVersion: project.version, gameVersion: '1.19.2', javaVersion: '17', apiVersion: '0.77.0') }
}

sourceSets.main.resources.srcDir('../chunk-nbt/src/main/resources')

sourceSets.main.java.srcDir('../fabric-nbt/src/main/java')
sourceSets.main.resources.srcDir('../fabric-nbt/src/main/resources')
