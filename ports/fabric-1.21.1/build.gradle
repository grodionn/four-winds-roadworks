plugins {
    id 'fabric-loom' version '1.10.5'
}

repositories { mavenCentral() }

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.17.3'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.18+1.21.1'
}

apply from: '../modern.gradle'

processResources {
    exclude 'META-INF/neoforge.mods.toml', 'data/fourwindsroadworks/neoforge/**'
    filesMatching('fabric.mod.json') { expand(modVersion: project.version) }
}
