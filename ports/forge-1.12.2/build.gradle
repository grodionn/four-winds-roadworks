buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197' }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java'
apply from: 'wayposts.gradle'

group = 'dev.fourwinds'
version = '1.8.3+mc1.12.2'
archivesBaseName = 'four-winds-roadworks-forge'
sourceCompatibility = targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

minecraft { mappings channel: 'stable', version: '39-1.12' }
dependencies { minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2859' }

sourceSets.main.java {
    srcDirs 'src/main/java', '../legacy-common/src/main/java', '../../src/main/java'
    include 'dev/fourwinds/roads/Classic*.java', 'dev/fourwinds/roads/Legacy*.java',
            'dev/fourwinds/roads/RoadLayout.java', 'dev/fourwinds/roads/RoadSection.java', 'dev/fourwinds/roads/BridgeBay.java'
}
processResources {
    from('../../src/main/resources') { include 'four-winds.png' }
    filesMatching('mcmod.info') { expand(modVersion: project.version) }
}
jar.finalizedBy 'reobfJar'
