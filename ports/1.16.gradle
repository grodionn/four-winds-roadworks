apply from: '../../gradle/release.gradle'

java.toolchain.languageVersion = JavaLanguageVersion.of(8)
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

sourceSets.main.java.srcDirs('../legacy-common/src/main/java', '../../src/mc1.16.5/java')
sourceSets.main.resources.srcDir('../../src/mc1.16.5/resources')
tasks.named('compileJava') {
    source fileTree('../../src/main/java') {
        include 'dev/fourwinds/roads/RoadLayout.java', 'dev/fourwinds/roads/RoadSection.java',
                'dev/fourwinds/roads/BridgeBay.java', 'dev/fourwinds/roads/WaysidePlan.java', 'dev/fourwinds/roads/PierLayout.java', 'dev/fourwinds/roads/client/WaypostRenderer.java',
                'dev/fourwinds/roads/client/WaypostModelIds.java'
    }
}
processResources {
    from('../../src/main/resources') { include 'four-winds.png', 'assets/fourwindsroadworks/**' }
    inputs.property('modVersion', project.version)
}

sourceSets.test.java.srcDir('../legacy-common/src/test/java')
tasks.register('checkRoads', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.fourwinds.roads.LegacyRoadsCheck'
}
check.dependsOn checkRoads
