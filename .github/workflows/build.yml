name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check roads (${{ matrix.loader }} ${{ matrix.minecraft }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {loader: NeoForge, minecraft: 1.21.1, project: .}
          - {loader: Forge, minecraft: 1.21.1, project: ports/forge-1.21.1}
          - {loader: Fabric, minecraft: 1.21.1, project: ports/fabric-1.21.1}
          - {loader: Forge, minecraft: 1.20.1, project: ports/forge-1.20.1, toolchain: '17'}
          - {loader: Fabric, minecraft: 1.20.1, project: ports/fabric-1.20.1, toolchain: '17'}
          - {loader: Forge, minecraft: 1.19.2, project: ports/forge-1.19.2, toolchain: '17'}
          - {loader: Fabric, minecraft: 1.19.2, project: ports/fabric-1.19.2, toolchain: '17'}
          - {loader: Forge, minecraft: 1.18.2, project: ports/forge-1.18.2, toolchain: '17'}
          - {loader: Fabric, minecraft: 1.18.2, project: ports/fabric-1.18.2, toolchain: '17'}
          - {loader: Forge, minecraft: 1.16.5, project: ports/forge-1.16.5, toolchain: '8'}
          - {loader: Fabric, minecraft: 1.16.5, project: ports/fabric-1.16.5, toolchain: '8'}
          - {loader: Forge, minecraft: 1.12.2, project: ports/forge-1.12.2, classicForge: true}
          - {loader: Legacy Fabric, minecraft: 1.12.2, project: ports/legacy-fabric-1.12.2, toolchain: '8'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: matrix.toolchain
        with:
          distribution: temurin
          java-version: ${{ matrix.toolchain }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.classicForge && '8' || '21' }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - if: matrix.classicForge
        working-directory: ports/forge-1.12.2
        run: ./gradlew --no-daemon build
      - if: ${{ !matrix.classicForge }}
        run: ./gradlew --no-daemon -p "${{ matrix.project }}" -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64 build
      - name: Verify and stage the installable JAR
        id: package
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          asset=$(python3 tools/package_release.py --project "$PROJECT")
          echo "path=$asset" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: four-winds-roadworks-${{ matrix.loader }}-${{ matrix.minecraft }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
